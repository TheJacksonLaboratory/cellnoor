[workspace]
resolver = "3"
members = [
    "any-value",
    "scamplepy",
    "scamplers",
    "scamplers-macros",
    "scamplers-schema",
    "time",
    "uuid",
    "valid-string",
]
default-members = ["scamplers"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
deadpool-diesel = { version = "0.6.1", features = ["postgres"] }
base64 = { version = "0.22.1" }
csv = { version = "1.4.0" }
heck = { version = "0.5.0" }
js-sys = { version = "0.3.77" }
clap = { version = "4.5.53", features = ["derive", "env"] }
anyhow = "1.0.100"
axum = { version = "0.8.8", default-features = false, features = [
    "http2",
    "json",
    "macros",
    "query",
] }
tokio = { version = "1.48.0", features = [
    "macros",
    "rt-multi-thread",
    "signal",
] }
regex = "1.12.2"
axum-extra = { version = "0.12.5", features = ["typed-header", "query"] }
camino = { version = "1.2.2", features = ["serde1"] }
thiserror = "2.0.17"
_uuid = { package = "uuid", version = "1.18.1", features = ["serde", "v7"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.148", features = ["float_roundtrip"] }
diesel = { version = "2.3.5", default-features = false, features = [
    "postgres",
    "without-deprecated",
    "time",
    "uuid",
    "serde_json",
    "32-column-tables",
] }
_time = { package = "time", version = "0.3.41", features = [
    "serde-human-readable",
] }
futures = { version = "0.3.31" }
valuable = { version = "0.1.1", features = ["derive"] }
garde = { version = "0.22.1", features = ["derive", "email", "serde", "regex"] }
strum = { version = "0.27.2", features = ["derive"] }
scraper = { version = "0.25.0", features = ["serde"] }
wasm-bindgen = { version = "0.2.103", features = ["enable-interning"] }
dotenvy = { version = "0.15.7" }
testcontainers-modules = { version = "0.14.0", features = [
    "postgres",
    "blocking",
] }
diesel_migrations = { version = "2.3.1", features = ["postgres"] }
tracing-appender = "0.2.4"
tracing = { version = "0.1.44", features = ["valuable"] }
tower = { version = "0.5.2", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["json"] }
argon2 = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "set-header"] }
rand = "0.9.2"
reqwest = { version = "0.12.28", features = [ "json" ] }
url = { version = "2.5.7", features = ["serde"] }
syn = { version = "2.0.111", features = ["full"] }
quote = { version = "1.0.42" }
proc-macro2 = { version = "1.0.104" }
serde-wasm-bindgen = { version = "0.6.5" }
wasm-bindgen-futures = { version = "0.4.50" }
pretty_assertions = { version = "1.4.1" }
rstest = { version = "0.26.1", default-features = false }
pyo3 = { version = "0.27.2", features = [
    "uuid",
    "time",
    "experimental-async",
    "multiple-pymethods",
    "serde",
    "anyhow",
] }
bon = { version = "3.8.1" }
derive_more = { version = "2.1.1", features = ["try_into", "from"] }
getrandom = { version = "0.3.4" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
get_first = "allow"
missing_panics_doc = "allow"
unsafe_derive_deserialize = "allow"
too_many_arguments = "allow"
missing_errors_doc = "allow"

[workspace.lints.rust]
async_fn_in_trait = "allow"
