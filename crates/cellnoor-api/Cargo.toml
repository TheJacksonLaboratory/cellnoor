[package]
name = "cellnoor-api"
version = "0.1.0"
edition = "2024"

[dependencies]
csv.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http.workspace = true
camino.workspace = true
rand.workspace = true
aide.workspace = true
csvranger.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
deadpool-postgres.workspace = true
cellnoor-types = { path = "../cellnoor-types", features = [
    "schemars",
    "postgres-types",
] }
axum.workspace = true
axum-extra.workspace = true
anyhow.workspace = true
uuid.workspace = true
schemars.workspace = true
secrecy.workspace = true
postgres-types.workspace = true
jiff.workspace = true
thiserror.workspace = true
config.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
strum.workspace = true
sha3.workspace = true
regex.workspace = true
futures.workspace = true
serde_json.workspace = true
zstd.workspace = true
tempfile = { optional = true, workspace = true }
reqwest = { optional = true, workspace = true }

[features]
dev = ["axum/__private", "uuid/v4", "tempfile", "reqwest"]

[dev-dependencies]
axum = {workspace = true, features = ["__private"] }
uuid = { workspace = true, features = ["v4"] }
pretty_assertions.workspace = true
tempfile.workspace = true
reqwest.workspace = true
