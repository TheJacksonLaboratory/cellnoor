[workspace]
members = [
    "cellnoor",
    "cellnoor-types",
    "cellnoor-types/macro-attributes",
    "nonempty", "positive",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
camino = { version = "1.2.2" }
rand = { version = "0.10.1" }
csvranger = { version = "0.3.0", features = ["legacy", "serde"] }
csv = { version = "1.4.0" }
regex = {version = "1.12.3"}
aide = { version = "0.16.0-alpha.4", features = [
  "axum",
  "axum-json",
  "axum-query",
  "macros",
  "redoc",
  "skip_serializing_defaults",
] }
futures = { version = "0.3.32" }
anyhow = "1.0.102"
config = {version = "0.15.22", default-features = false }
axum = { version = "0.8.9", default-features = false, features = [
  "http2",
  "json",
  "macros",
  "multipart",
  "query",
  "tokio",
] }
sha3 = {version = "0.11.0"}
proc-macro2 = {version = "1.0.106"}
syn = { version = "2.0.117", default-features = false, features = [
  "full",
  "parsing",
] }
strum = {version = "0.28.0", features = ["derive"]}
bytes = { version = "1.11.1" }
quote = { version = "1.0.45" }
jsonwebtoken = {version = "10.3.0", features = ["rust_crypto"]}
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie", "typed-header"] }
dotenvy = { version = "0.15.7" }
secrecy = { version = "0.10.3", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
jiff = { version = "0.2.24", features = ["serde"] }
pretty_assertions = { version = "1.4.1" }
schemars = { version = "1.2.1", features = ["jiff02", "uuid1"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149" }
postgres-types = {version = "0.2.13", features = ["derive", "array-impls", "with-jiff-0_2", "with-serde_json-1", "with-uuid-1"]}
thiserror = "2.0.18"
uuid = { version = "1.23.0", features = ["serde"] }
tokio = {version = "1.52.1", features = ["macros", "rt-multi-thread"]}
deadpool-postgres = { version = "0.14.1", features = ["serde"] }
headers = {version = "0.4.1"}
zstd = { version = "0.13.3" }

[workspace.lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
pedantic = { level = "warn", priority = -1 }
result_large_err = "allow"
unsafe_derive_deserialize = "allow"
wildcard_imports = "allow"

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
