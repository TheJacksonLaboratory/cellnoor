[workspace]
members = [
  "cellnoor",
  "cellnoor-types",
  "nonempty",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
aide = { version = "0.16.0-alpha.4", features = [
  "axum",
  "axum-json",
  "macros",
  "redoc",
  "skip_serializing_defaults",
] }
anyhow = "1.0.102"
axum = { version = "0.8.9", default-features = false, features = [
  "http2",
  "json",
  "macros",
  "multipart",
  "query",
  "tokio",
] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
dotenvy = { version = "0.15.7" }
futures = { version = "0.3.32" }
headers = { version = "0.4.1" }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
regex = "1.12.3"
rand = { version = "0.10.1" }
camino = { version = "1.2.2", features = ["serde1"] }
secrecy = { version = "0.10.3", features = ["serde"] }
strum = { version = "0.28.0", features = ["derive"] }
tracing = { version = "0.1.44" }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
zstd = { version = "0.13.3" }
clap = { version = "4.6.1", features = ["derive", "env"] }
csv = { version = "1.4.0" }
jiff = { version = "0.2.24", features = ["serde"] }
pretty_assertions = { version = "1.4.1" }
schemars = { version = "1.2.1", features = ["jiff02", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
tokio-postgres = {version = "0.17.7", features = ["array-impls", "with-jiff-0_2", "with-serde_json-1", "with-uuid-1"]}
postgres-types = {version = "0.2.13", features = ["derive", "array-impls", "with-jiff-0_2", "with-serde_json-1", "with-uuid-1"]}
thiserror = "2.0.18"
uuid = { version = "1.23.0", features = ["serde", "v7"] }
proc-macro2 = { version = "1.0.106" }
quote = { version = "1.0.45" }
syn = { version = "2.0.117", default-features = false, features = [
  "full",
  "parsing",
] }
tokio = {version = "1.52.1", features = ["macros", "rt-multi-thread"]}

[workspace.lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
pedantic = { level = "warn", priority = -1 }
result_large_err = "allow"
unsafe_derive_deserialize = "allow"
wildcard_imports = "allow"
