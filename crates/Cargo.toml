[workspace]
members = [
    "cellnoor",
    "cellnoor-types",
    "nonempty",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
aide = { version = "0.16.0-alpha.4", features = [
  "axum",
  "axum-json",
  "macros",
  "redoc",
  "skip_serializing_defaults",
] }
anyhow = "1.0.102"
config = {version = "0.15.22", default-features = false, features = ["toml"]}
leptos = { version = "0.8.19", features = ["nightly"] }
leptos_router = { version = "0.8.13", features = ["nightly"] }
console_error_panic_hook = { version = "0.1" }
axum = { version = "0.8.9", default-features = false, features = [
  "http2",
  "json",
  "macros",
  "multipart",
  "query",
  "tokio",
] }
jsonwebtoken = {version = "10.3.0", features = ["rust_crypto"]}
leptos_axum = { version = "0.8.9" }
leptos_meta = { version = "0.8.6" }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
dotenvy = { version = "0.15.7" }
camino = { version = "1.2.2", features = ["serde1"] }
secrecy = { version = "0.10.3", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
jiff = { version = "0.2.24", features = ["serde"] }
pretty_assertions = { version = "1.4.1" }
schemars = { version = "1.2.1", features = ["jiff02", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
postgres-types = {version = "0.2.13", features = ["derive", "array-impls", "with-jiff-0_2", "with-serde_json-1", "with-uuid-1"]}
thiserror = "2.0.18"
uuid = { version = "1.23.0", features = ["serde", "v7"] }
tokio = {version = "1.52.1", features = ["macros", "rt-multi-thread"]}
wasm-bindgen = {version = "0.2.120", features = ["enable-interning"]}
deadpool-postgres = {version = "0.14.1"}

[workspace.lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
pedantic = { level = "warn", priority = -1 }
result_large_err = "allow"
unsafe_derive_deserialize = "allow"
wildcard_imports = "allow"
