[workspace]
members = ["cellnoor-api", "cellnoor-types", "cellnoor-types/macro-attributes"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
aide = { version = "0.16.0-alpha.4", features = [
    "axum",
    "axum-json",
    "axum-query",
    "macros",
    "redoc",
    "skip_serializing_defaults",
] }
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = [
    # Unfortunately http1 is required for the UI backend to communicate over unix socket with the API :) JavaScript is so advanced!
    "http1",
    "http2",
    "json",
    "macros",
    "multipart",
    "query",
    "tokio",
] }
axum-extra = { version = "0.12.6", default-features = false, features = [
    "cookie",
] }
bytes = { version = "1.12.1" }
camino = { version = "1.2.6" }
config = { version = "0.15.27", default-features = false }
csv = { version = "1.4.0" }
csvranger = { version = "0.3.1", features = ["legacy", "schemars", "serde"] }
deadpool-postgres = { version = "0.14.2", features = ["serde"] }
futures = { version = "0.3.34" }
jiff = { version = "0.2.38", features = ["serde"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
postgres-types = { version = "0.2.14", features = [
    "array-impls",
    "derive",
    "with-jiff-0_2",
    "with-serde_json-1",
    "with-uuid-1",
] }
pretty_assertions = { version = "1.4.1" }
proc-macro2 = { version = "1.0.107" }
quote = { version = "1.0.47" }
rand = { version = "0.10.3" }
regex = { version = "1.13.1" }
reqwest = { version = "0.13.5", features = ["multipart"] }
schemars = { version = "1.2.3", features = ["jiff02", "uuid1"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
sha3 = { version = "0.12.0" }
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "3.0.9", default-features = false, features = [
    "full",
    "parsing",
] }
tempfile = { version = "3.27.0" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["normalize-path", "trace"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "registry",
    "std",
] }
uuid = { version = "1.29.0", features = ["serde"] }
zstd = { version = "0.14.3" }

[workspace.lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
pedantic = { level = "warn", priority = -1 }
result_large_err = "allow"
unsafe_derive_deserialize = "allow"
wildcard_imports = "allow"

[workspace.lints.rust]
dead_code_pub_in_binary = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
unit_bindings = "warn"
unreachable_pub = "warn"
