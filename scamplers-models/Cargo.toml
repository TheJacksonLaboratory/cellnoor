[package]
edition.workspace = true
name = "scamplers-models"
version = "0.1.0"

[dependencies]
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
bon = { workspace = true, optional = true }
default-vec = { path = "../default-vec", features = ["serde"] }
diesel = { workspace = true, optional = true, features = [
  "32-column-tables",
  "postgres",
  "serde_json",
  "uuid",
  "without-deprecated",
] }
jiff.workspace = true
jiff-diesel = { workspace = true, optional = true }
macro-attributes = { path = "macro-attributes" }
macros = { path = "macros" }
non-empty-string = { path = "../non-empty-string", features = ["serde"] }
scamplers-schema = { path = "../scamplers-schema", optional = true }
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
ts-rs = { workspace = true, optional = true }
uuid.workspace = true

[lints]
workspace = true

[features]
app = [
  "dep:axum",
  "dep:axum-extra",
  "dep:diesel",
  "dep:jiff-diesel",
  "dep:scamplers-schema",
  "non-empty-string/diesel",
]
builder = ["dep:bon"]
typescript = [
  "default-vec/typescript",
  "dep:ts-rs",
  "non-empty-string/typescript",
]
