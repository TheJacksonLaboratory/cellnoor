# This is the base compose file. Merge this with one of compose.dev.yaml of compose.prod.yaml to produce a running
# application with the following command:
# docker compose --file compose.yaml --file compose.dev.yaml

# Shared resources
volumes:
  db-data:
  db-socket:
  auth-socket:
secrets:
  root_db_password:
    environment: CELLNOOR_ROOT_DB_PASSWORD
  app_db_password:
    environment: CELLNOOR_APP_DB_PASSWORD
  auth_db_password:
    environment: CELLNOOR_AUTH_DB_PASSWORD
  auth_secret:
    environment: CELLNOOR_AUTH_SECRET
  microsoft_entra_tenant_id:
    environment: CELLNOOR_MICROSOFT_ENTRA_TENANT_ID
  microsoft_entra_client_id:
    environment: CELLNOOR_MICROSOFT_ENTRA_CLIENT_ID
  microsoft_entra_client_secret:
    environment: CELLNOOR_MICROSOFT_ENTRA_CLIENT_SECRET
services:
  db:
    image: postgres:18-alpine
    restart: always
    secrets: [root_db_password, app_db_password, auth_db_password]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/root_db_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    pull_policy: weekly
    healthcheck:
      test: pg_isready || exit 1
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      [
        &db_data_volume db-data:/var/lib/postgresql,
        &db_socket_volume db-socket:/var/run/postgresql,
      ]
  migrate:
    image: migrate/migrate
    secrets: [root_db_password]
    depends_on:
      db:
        condition: service_healthy
    # We override the entrypoint to pass in the password file
    entrypoint: /bin/sh -c 'migrate -path /migrations -database postgresql://postgres:$(cat /run/secrets/root_db_password)@/?host=/var/run/postgresql up'
    volumes: [./db/migrations:/migrations, *db_socket_volume]
  cellnoor-auth:
    depends_on:
      migrate:
        condition: service_completed_successfully
    build:
      context: packages/cellnoor-auth
      target: final
    environment:
      DB_HOST: &db_host /var/run/postgresql
      UNIX_DOMAIN_SOCKET: &auth_socket /run/cellnoor-auth/cellnoor-auth.sock
    secrets:
      [
        auth_db_password,
        auth_secret,
        microsoft_entra_tenant_id,
        microsoft_entra_client_id,
        microsoft_entra_client_secret,
      ]
    volumes:
      [*db_socket_volume, &auth_socket_volume auth-socket:/run/cellnoor-auth]
