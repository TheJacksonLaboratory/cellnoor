# This is the base compose file. Merge this with one of compose.dev.yaml of compose.prod.yaml to produce a running
# application with the following command:
# docker compose --file compose.yaml --file compose.dev.yaml
services:
  postgres:
    image: postgres:18-alpine
    restart: always
    secrets:
      - db_root_password
      - db_name
    environment:
      POSTGRES_USER: &db_root_user postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_root_password
      POSTGRES_DB_FILE: /run/secrets/db_name
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    pull_policy: always
    healthcheck:
      test: pg_isready --dbname $(cat /run/secrets/db_name) || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database:/var/lib/postgresql
      - database-socket:/var/run/postgresql
  &api_host cellnoor-api:
    build:
      context: .
      dockerfile: cellnoor-api/Dockerfile
      target: final
      args:
        UID: &uid "10001"
        ADDRESS: &api_socket /run/cellnoor-api/cellnoor-api.sock
      tags:
        - ghcr.io/thejacksonlaboratory/cellnoor-api:latest
    environment:
      DB_ROOT_USER: *db_root_user
      DB_HOST: &db_host /var/run/postgresql
      DB_PORT: &db_port 5432
      ADDRESS: *api_socket
    secrets:
      - source: db_root_password
        uid: *uid
      - source: cellnoor_api_db_password
        uid: *uid
      - source: cellnoor_ui_db_password
        uid: *uid
      - source: db_name
        uid: *uid
    volumes:
      - logs:/logs
      - &database_socket_volume database-socket:/var/run/postgresql
      - &api_socket_volume cellnoor-api-socket:/run/cellnoor-api
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: curl --fail --unix-socket /run/cellnoor-api/cellnoor-api.sock http://localhost/api/health || exit 1
      interval: 1s
      start_period: 10s
      start_interval: 1s
      timeout: 5s
      retries: 10
  &ui_host cellnoor-ui:
    build:
      context: .
      dockerfile: cellnoor-ui/Dockerfile
      target: final
      args:
        UID: *uid
        SOCKET_PATH: &ui_socket /run/cellnoor-ui/cellnoor-ui.sock
      tags:
        - ghcr.io/thejacksonlaboratory/cellnoor-ui:latest
    environment:
      IN_DOCKER: "true"
      DB_HOST: *db_host
      DB_PORT: *db_port
      # https://svelte.dev/docs/kit/adapter-node#Environment-variables-PORT-HOST-and-SOCKET_PATH
      HOST: ""
      SOCKET_PATH: *ui_socket
      API_URL: http://cellnoor-api/api
      API_SOCKET: *api_socket
    depends_on:
      cellnoor-api:
        condition: service_healthy
    healthcheck:
      test: curl --fail --unix-socket /run/cellnoor-ui/cellnoor-ui.sock http://localhost/health || exit 1
      interval: 1s
      start_period: 5s
      start_interval: 1s
      timeout: 1s
      retries: 5
    secrets:
      - source: cellnoor_ui_db_password
        uid: *uid
      - source: db_name
        uid: *uid
      - source: microsoft_entra_client_id
        uid: *uid
      - source: microsoft_entra_client_secret
        uid: *uid
      - source: microsoft_entra_tenant
        uid: *uid
      - source: auth_secret
        uid: *uid
    volumes:
      - *database_socket_volume
      - *api_socket_volume
      - &ui_socket_volume cellnoor-ui-socket:/run/cellnoor-ui
  caddy:
    image: caddy:2-alpine
    environment:
      API_SOCKET: *api_socket
      UI_SOCKET: *ui_socket
    restart: always
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy
      - caddy-data:/data
      - caddy-config:/config
      - *api_socket_volume
      - *ui_socket_volume
    pull_policy: always
    depends_on:
      cellnoor-ui:
        condition: service_healthy
volumes:
  logs:
  caddy-data:
  caddy-config:
  database:
  database-socket:
  cellnoor-api-socket:
  cellnoor-ui-socket:
secrets:
  db_root_password:
    environment: CELLNOOR_DB_ROOT_PASSWORD
  cellnoor_api_db_password:
    environment: CELLNOOR_API_DB_PASSWORD
  cellnoor_ui_db_password:
    environment: CELLNOOR_UI_DB_PASSWORD
  db_name:
    environment: CELLNOOR_DB_NAME
  microsoft_entra_client_id:
    environment: CELLNOOR_MICROSOFT_ENTRA_CLIENT_ID
  microsoft_entra_client_secret:
    environment: CELLNOOR_MICROSOFT_ENTRA_CLIENT_SECRET
  microsoft_entra_tenant:
    environment: CELLNOOR_MICROSOFT_ENTRA_TENANT
  auth_secret:
    environment: CELLNOOR_AUTH_SECRET
