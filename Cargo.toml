[workspace]
members = [
  "cellnoor-api",
  "crates/cellnoor-models",
  "crates/cellnoor-models/macro-attributes",
  "crates/cellnoor-models/macros",
  "crates/cellnoor-schema",
  "crates/default-vec",
  "crates/non-empty",
  "crates/ranged",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
aide = { version = "0.16.0-alpha.2", features = [
  "axum",
  "axum-json",
  "macros",
  "skip_serializing_defaults",
] }
anyhow = "1.0.101"
axum = { version = "0.8.8", default-features = false, features = [
  "http2",
  "json",
  "macros",
  "multipart",
  "tokio",
] }
axum-extra = { version = "0.12.5", features = ["cookie", "typed-header"] }
bon = { version = "3.8.2" }
camino = { version = "1.2.2", features = ["serde1"] }
clap = { version = "4.5.57", features = ["derive", "env"] }
csv = { version = "1.4.0" }
deranged = { version = "0.5.5" }
diesel = { version = "2.3.6", default-features = false }
diesel-async = { version = "0.7.4", features = [
  "deadpool",
  "migrations",
  "postgres",
] }
diesel-derive-newtype = { version = "2.1.2" }
diesel_migrations = { version = "2.3.1" }
dotenvy = { version = "0.15.7" }
form_urlencoded = { version = "1.2.2" }
futures = { version = "0.3.31" }
headers = { version = "0.4.1" }
heck = { version = "0.5.0" }
jiff = { version = "0.2.19", features = ["serde"] }
jiff-diesel = { version = "0.1.3", features = ["postgres"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
pretty_assertions = { version = "1.4.1" }
proc-macro2 = { version = "1.0.106" }
quote = { version = "1.0.44" }
rand = { version = "0.10.0" }
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
rstest = { version = "0.26.1", default-features = false }
schemars = { version = "1.2.1", features = ["jiff02", "uuid1"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149" }
strum = { version = "0.27.2", features = ["derive"] }
syn = { version = "2.0.114", default-features = false, features = [
  "full",
  "parsing",
] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread"] }
tokio-stream = { version = "0.1.18", default-features = false }
tower = { version = "0.5.3" }
tower-http = { version = "0.6.8", features = ["trace", "decompression-full"] }
tracing = { version = "0.1.44" }
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["json"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.20.0", features = ["serde", "v7"] }

[workspace.lints.clippy]
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
pedantic = { level = "warn", priority = -1 }
result_large_err = "allow"
unsafe_derive_deserialize = "allow"
wildcard_imports = "allow"
