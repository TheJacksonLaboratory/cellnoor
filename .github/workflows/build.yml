name: Build
permissions:
  contents: read
  packages: write
on:
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set cellnoor-api version
        run: echo "CELLNOOR_API_VERSION=$(cargo metadata --format-version 1 --no-deps | jq --raw-output '.packages[] | select(.name=="cellnoor-api") | .version')" >> "$GITHUB_ENV"

      - name: Set cellnoor-ui version
        run: echo "CELLNOOR_UI_VERSION=$(jq --raw-output '.version' cellnoor-ui/package.json)" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          push: true
