name: Build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cargo metadata --format-version 1 | jq --raw-output '.packages[] | select(.name == "cellnoor-api").version')
          docker build --tag ghcr.io/demhadais/cellnoor-api:latest --tag
          docker push ghcr.io/demhadais/cellnoor-api:${VERSION}
