name: Check SQL Code
on:
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.sql"
jobs:
  lint_sql:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install sqlfluff
        run: pip install sqlfluff

      - name: Lint code
        run: sqlfluff lint .
