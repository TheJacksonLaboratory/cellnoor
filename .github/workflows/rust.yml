name: Check Rust Code
on:
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.sql"
      - "**/*.rs"
      - "**/Cargo.toml"

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Cache cargo files
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Lint
        working-directory: crates
        run: cargo clippy --workspace --all-features

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Cache cargo files
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Install nightly toolchain
        run: rustup component add --toolchain nightly-2026-09-13 rustfmt # This is updated weekly-ish

      - name: Format
        working-directory: crates
        run: cargo +nightly-2026-09-13 fmt -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Cache cargo files
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Copy initial data
        run: cp initial-data.sample.json initial-data.json

      - name: Test
        run: ./scripts/dev/test.sh
