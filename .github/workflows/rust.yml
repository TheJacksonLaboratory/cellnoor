name: Check Rust Code
on:
  push:
    paths:
      - "**/*.rs"

jobs:
  check_scamplers-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Cache cargo files
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install diesel-cli
        run: cargo install diesel_cli --no-default-features --features postgres

      - name: Check schema
        working-directory: scamplers-schema
        run: diesel setup --database-url postgres://postgres@localhost/postgres --locked-schema

  # The two binaries of the workspace are linted rather than the entire workspace because `cargo clippy --workspace`
  # throws an error due to not selecting the correct features. Since scamplers-api and scamplers-typescript together
  # activate all the features and encompass all the crates, this transitively lints all the Rust code.
  lint_scamplers-api:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Cache cargo files
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Lint
        run: RUN_DIESEL_CLI=false cargo clippy --package scamplers-api

  lint_scamplers-typescript:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Cache cargo files
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Lint
        run: RUN_DIESEL_CLI=false cargo clippy --package scamplers-typescript

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Cache cargo files
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install nightly toolchain
        run: rustup component add --toolchain nightly-2025-11-17 rustfmt # This is updated weekly-ish

      - name: Format
        run: cargo +nightly-2025-11-10 fmt -- --check

  test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Cache cargo files
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Build
        run: RUN_DIESEL_CLI=false cargo build --tests

      - name: Test
        run: RUN_DIESEL_CLI=false cargo test --workspace --all-features
