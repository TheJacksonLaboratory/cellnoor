version: 2
updates:
  - package-ecosystem: cargo
    directory: ./crates
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    groups:
      all-rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: bun
    schedule:
      interval: daily
    directory: ./packages
    cooldown:
      default-days: 1
    groups:
      all-bun-dependencies:
        patterns:
          - "*"
