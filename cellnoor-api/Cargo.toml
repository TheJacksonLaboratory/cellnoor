[package]
edition.workspace = true
name = "cellnoor-api"

[dependencies]
aide.workspace = true
anyhow.workspace = true
axum.workspace = true
axum-extra.workspace = true
camino.workspace = true
cellnoor-models = { path = "../crates/cellnoor-models", features = ["app"] }
cellnoor-schema = { path = "../crates/cellnoor-schema" }
clap.workspace = true
csv.workspace = true
diesel = { workspace = true, features = ["serde_json", "uuid"] }
diesel-async.workspace = true
diesel_migrations.workspace = true
dotenvy.workspace = true
form_urlencoded.workspace = true
futures.workspace = true
headers.workspace = true
heck.workspace = true
jiff.workspace = true
jiff-diesel.workspace = true
jsonwebtoken.workspace = true
non-empty = { path = "../crates/non-empty" }
pretty_assertions = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
ranged = { path = "../crates/ranged", features = ["serde"] }
regex.workspace = true
reqwest.workspace = true
rstest.workspace = true
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
bon.workspace = true
cellnoor-models = { path = "../crates/cellnoor-models", features = [
  "app",
  "builder",
] }
pretty_assertions.workspace = true
rand.workspace = true

[features]
dummy-data = ["cellnoor-models/builder", "dep:pretty_assertions", "dep:rand"]
