services:
  postgres:
    command: -c max_connections=24 -c shared_buffers=4GB
  cellnoor-api:
    build: !reset null
    image: ghcr.io/thejacksonlaboratory/cellnoor-api:latest
    pull_policy: always
    environment:
      CELLNOOR_API_MAX_DB_POOL_SIZE: "4"
      JWT_ISSUER: &public_url https://cellnoor.jax.org
      JWT_AUDIENCE: &jwt_audience https://cellnoor.jax.org/api
      CELLNOOR_LOG_DIR: logs
    secrets:
      - source: initial_data
        uid: "10001"
  cellnoor-ui:
    build: !reset null
    image: ghcr.io/thejacksonlaboratory/cellnoor-ui:latest
    pull_policy: always
    environment:
      JWT_ISSUER: *public_url
      JWT_AUDIENCE: *jwt_audience
      PUBLIC_URL: *public_url
  caddy:
    environment:
      PUBLIC_URL: *public_url
      TLS_SETTINGS: tls /run/secrets/tls_certificate /run/secrets/tls_key
    secrets:
      - tls_certificate
      - tls_key
secrets:
  initial_data:
    file: ${CELLNOOR_INITIAL_DATA_PATH}
  tls_certificate:
    file: ${CELLNOOR_TLS_CERTIFICATE_PATH}
  tls_key:
    file: ${CELLNOOR_TLS_KEY_PATH}
