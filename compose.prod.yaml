services:
  cellnoor-auth:
    environment:
      NODE_ENV: production
      CELLNOOR_AUTH__PUBLIC_BASE_URL: ${CELLNOOR_PUBLIC_BASE_URL}
  cellnoor-api:
    environment:
      CELLNOOR_API__MAX_DB_POOL_SIZE: "4"
  caddy:
    environment:
      CELLNOOR_CADDY__PUBLIC_BASE_URL: ${CELLNOOR_PUBLIC_BASE_URL}
      CELLNOOR_CADDY__TLS_SETTINGS: tls /run/secrets/tls_certificate /run/secrets/tls_key
    secrets:
      - tls_certificate
      - tls_key
secrets:
  tls_certificate:
    file: ${CELLNOOR_TLS_CERTIFICATE_PATH}
  tls_key:
    file: ${CELLNOOR_TLS_KEY_PATH}
