services:
  cellnoor-api:
    build:
      args:
        BUILD_PROFILE: "dev"
    secrets:
      - source: initial_data
        uid: "10001"
  caddy:
    environment:
      PUBLIC_URL: localhost
  cellnoor-ui:
    environment:
      API_URL: http://cellnoor-api/api
secrets:
  initial_data:
    file: initial_data
